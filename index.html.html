<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>出差紀錄系統 Pro</title>
<!--
正式版單一HTML
功能:
- IndexedDB永久儲存
- 圖片永久儲存
- 新增/編輯/刪除
- 月份查詢
- 民國年顯示
- 機車2元、汽車3元
- PDF下載(jsPDF CDN)
-->
<style>
body{font-family:Microsoft JhengHei;background:#eef3f8;margin:0;padding:20px}
.header{background:#1e5fd8;color:#fff;padding:18px;border-radius:12px;font-size:28px;font-weight:bold}
.card{background:#fff;border-radius:12px;padding:15px;margin-top:15px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,select{width:100%;padding:8px;box-sizing:border-box}
button{padding:10px 14px;margin:4px;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#1e5fd8;color:#fff;position:sticky;top:0}
.thumb{max-width:80px;max-height:60px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7)}
.modal img{max-width:90%;max-height:90%;display:block;margin:2% auto}
</style>
</head>
<body>

<div class="header">出差紀錄系統</div>

<div class="card">
<h3>新增 / 編輯</h3>
<div class="grid">
<div><label>日期</label><input type="date" id="date"></div>
<div><label>交通工具</label>
<select id="vehicle">
<option value="2">機車(2元/公里)</option>
<option value="3">汽車(3元/公里)</option>
</select>
</div>
<div><label>公里數</label><input id="km" type="number" step="0.1"></div>
<div><label>雜費</label>
<select id="misc">
<option>50</option><option>80</option><option>100</option><option>180</option>
</select>
</div>
</div>
<br>
<input type="file" id="photo" accept="image/*">
<br><br>
<button onclick="saveRecord()">儲存</button>
<span id="msg"></span>
</div>

<div class="card">
<h3>月份查詢</h3>
<input type="month" id="monthFilter">
<button onclick="loadRecords()">查詢</button>
<button onclick="exportPDF()">下載PDF</button><button onclick="printPreview()">列印</button>
</div>

<div class="card">
<div id="count"></div>
<table>
<thead>
<tr>
<th>編號</th><th>日期</th><th>工具</th><th>公里</th>
<th>里程費</th><th>雜費</th><th>合計</th>
<th>圖片</th><th>編輯</th><th>刪除</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>
</div>


<div class="card">
<h3>PDF預覽</h3>
<div id="pdfPreview"></div>
</div>

<div class="modal" id="modal" onclick="this.style.display='none'">
<img id="bigImg">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
let db, editId=null;
document.getElementById('date').value=new Date().toISOString().split('T')[0];

const req=indexedDB.open('TripProDB',1);

req.onupgradeneeded=e=>{
 const db=e.target.result;
 if(!db.objectStoreNames.contains('records')){
   db.createObjectStore('records',{keyPath:'id',autoIncrement:true});
 }
};

req.onsuccess=e=>{
 db=e.target.result;
 loadRecords();
};

function roc(d){
 const x=new Date(d);
 return (x.getFullYear()-1911)+'年'+(x.getMonth()+1)+'月'+x.getDate()+'日';
}

function saveRecord(){
 const file=document.getElementById('photo').files[0];

 const finish=(img)=>{
   let km=Math.round(parseFloat(document.getElementById('km').value||0));
   let rate=parseInt(document.getElementById('vehicle').value);
   let mileage=km<15?0:km*rate;

   const data={
     date:date.value,
     vehicle:rate==2?'機車':'汽車',
     rate,km,mileage,
     misc:parseInt(misc.value),
     image:img||''
   };

   const tx=db.transaction(['records'],'readwrite');
   const store=tx.objectStore('records');

   if(editId){
     data.id = editId;
     store.put(data);
   }else{
     store.add(data);
   }

   tx.oncomplete=()=>{
     editId=null;
     msg.innerText='✓ 儲存成功';
     loadRecords();
   };
 };

 if(file){
   const r=new FileReader();
   r.onload=e=>finish(e.target.result);
   r.readAsDataURL(file);
 }else{
   finish('');
 }
}

function loadRecords(){
 const tx=db.transaction(['records'],'readonly');
 const store=tx.objectStore('records');
 const req=store.getAll();

 req.onsuccess=()=>{
   let rows=req.result;
   const f=monthFilter.value;
   if(f) rows=rows.filter(x=>x.date.startsWith(f));

   count.innerHTML='共 '+rows.length+' 筆';

   tb.innerHTML='';
   if(document.getElementById('pdfPreview')) document.getElementById('pdfPreview').innerHTML='';
   let previewHtml='';

   rows.forEach((r,i)=>{
     if(i%2===0) previewHtml += `<div class="pdf-page" style="background:#fff;padding:20px;">`;
     previewHtml += `<div style="padding:15px;border-bottom:1px solid #ccc">
       <h3>${i+1}. ${roc(r.date)}</h3>
       <div>行駛：</div>
       <div>${r.km<15?'未達15公里 = 0元':r.km+'公里 × '+r.rate+'元 = '+r.mileage+'元'}</div>
       <br>
       <div>雜費：${r.misc}元</div><br>
       ${r.image?'<img src="'+r.image+'" style="width:16.98cm;height:10.78cm;object-fit:cover">':''}
       </div>`;
     if(i%2===1 || i===rows.length-1) previewHtml += `</div>`;

     const total=r.mileage+r.misc;

     tb.innerHTML+=`
     <tr>
      <td>${i+1}</td>
      <td>${roc(r.date)}</td>
      <td>${r.vehicle}</td>
      <td>${r.km}</td>
      <td>${r.km<15?'未達15公里=0元':r.km+'×'+r.rate+'='+r.mileage}</td>
      <td>${r.misc}</td>
      <td>${total}</td>
      <td>${r.image?'<img class="thumb" src="'+r.image+'" onclick="showImg(\''+r.image+'\')">':''}</td>
      <td><button onclick="editRec(${r.id})">編輯</button></td>
      <td><button onclick="delRec(${r.id})">刪除</button></td>
     </tr>`;
   });
   if(document.getElementById('pdfPreview')) document.getElementById('pdfPreview').innerHTML=previewHtml;
 };
}

function showImg(src){
 bigImg.src=src;
 modal.style.display='block';
}

function editRec(id){
 const tx=db.transaction(['records'],'readonly');
 tx.objectStore('records').get(id).onsuccess=e=>{
   const r=e.target.result;
   editId=r.id;
   date.value=r.date;
   km.value=r.km;
   misc.value=r.misc;
   vehicle.value=r.rate;
 };
}

function delRec(id){
 if(!confirm('確定刪除?')) return;
 const tx=db.transaction(['records'],'readwrite');
 tx.objectStore('records').delete(id);
 tx.oncomplete=loadRecords;
}


async function exportPDF(){
 const { jsPDF } = window.jspdf;
 const pages = document.querySelectorAll('#pdfPreview .pdf-page');

 if(!pages.length){
   alert('沒有可匯出的資料');
   return;
 }

 const pdf = new jsPDF('p','mm','a4');

 for(let i=0;i<pages.length;i++){
   const canvas = await html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff'});
   const img = canvas.toDataURL('image/png');

   const w = 190;
   const h = canvas.height * w / canvas.width;

   if(i>0) pdf.addPage();
   pdf.addImage(img,'PNG',10,10,w,h);
 }

 pdf.save('出差紀錄.pdf');
}

function printPreview(){
 const win = window.open('');
 win.document.write('<html><head><title>列印</title></head><body>'+document.getElementById("pdfPreview").innerHTML+'</body></html>');
 win.document.close();
 setTimeout(()=>win.print(),500);
}

</script>
</body>
</html>
