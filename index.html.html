<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>出差紀錄系統</title>
<style>
body{font-family:Microsoft JhengHei;padding:20px;background:#eef4fb}
h1{background:#1e5fd8;color:#fff;padding:12px;border-radius:8px}
.card{background:#fff;padding:15px;margin:12px 0;border-radius:8px}
input,select{padding:8px;margin:4px;width:220px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#1e5fd8;color:#fff}
img{max-width:120px}
</style>
</head>
<body>
<h1>出差紀錄系統</h1>

<div class="card">
<input type="date" id="date">
<select id="vehicle">
<option value="2">機車(2元/公里)</option>
<option value="3">汽車(3元/公里)</option>
</select>
<input type="number" id="km" placeholder="公里數">
<select id="misc">
<option value="50">50元</option>
<option value="80">80元</option>
<option value="100">100元</option>
<option value="180">180元</option>
</select>
<input type="file" id="photo" accept="image/*">
<button onclick="addRecord()">新增紀錄</button>
<span id="msg"></span>
</div>

<div class="card">
<input type="month" id="filterMonth">
<button onclick="loadData()">查詢</button>
</div>

<table>
<thead><tr>
<th>編號</th><th>日期</th><th>工具</th><th>公里</th><th>里程費</th><th>雜費</th><th>合計</th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>

<script>
document.getElementById('date').value=new Date().toISOString().split('T')[0];

let db;
const req=indexedDB.open("TripDB",1);

req.onupgradeneeded=e=>{
 db=e.target.result;
 if(!db.objectStoreNames.contains("records")){
   db.createObjectStore("records",{keyPath:"id",autoIncrement:true});
 }
};

req.onsuccess=e=>{
 db=e.target.result;
 loadData();
};

function rocDate(v){
 const d=new Date(v);
 return (d.getFullYear()-1911)+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
}

function addRecord(){
 if(!db){alert("資料庫尚未載入");return;}
 const km=parseFloat(document.getElementById("km").value||0);
 const roundKm=Math.round(km);
 const rate=parseInt(document.getElementById("vehicle").value);
 const mileage=roundKm<15?0:roundKm*rate;

 const data={
   date:document.getElementById("date").value,
   vehicle:rate===2?"機車":"汽車",
   rate:rate,
   km:roundKm,
   mileage:mileage,
   misc:parseInt(document.getElementById("misc").value)
 };

 const tx=db.transaction(["records"],"readwrite");
 tx.objectStore("records").add(data);

 tx.oncomplete=()=>{
   document.getElementById("msg").innerText="✓ 新增成功";
   loadData();
 };
}

function loadData(){
 if(!db) return;

 const filter=document.getElementById("filterMonth").value;
 const tx=db.transaction(["records"],"readonly");
 const store=tx.objectStore("records");
 const req=store.getAll();

 req.onsuccess=()=>{
   let rows=req.result;

   if(filter){
      rows=rows.filter(r=>r.date.startsWith(filter));
   }

   const tb=document.getElementById("tbody");
   tb.innerHTML="";

   rows.forEach((r,i)=>{
      const total=r.mileage+r.misc;
      tb.innerHTML+=`
      <tr>
      <td>${i+1}</td>
      <td>${rocDate(r.date)}</td>
      <td>${r.vehicle}</td>
      <td>${r.km}</td>
      <td>${r.km<15?'未達15公里=0元':r.km+'×'+r.rate+'='+r.mileage+'元'}</td>
      <td>${r.misc}</td>
      <td>${total}</td>
      </tr>`;
   });
 };
}
</script>
</body>
</html>
