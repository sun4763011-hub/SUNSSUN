<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出差紀錄系統 V3</title>
<style>
body{font-family:Microsoft JhengHei,sans-serif;background:#eef4ff;margin:20px}
h1{background:#2563eb;color:#fff;padding:15px;border-radius:10px}
.card{background:#fff;padding:15px;border-radius:10px;margin:12px 0;box-shadow:0 2px 6px rgba(0,0,0,.1)}
input,select{padding:8px;width:100%;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
button{padding:10px 15px;margin:5px;border:none;border-radius:6px;color:#fff;cursor:pointer}
.primary{background:#2563eb}.success{background:#16a34a}.danger{background:#dc2626}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#2563eb;color:#fff}
img.thumb{width:120px;max-height:80px}
</style>
</head>
<body>
<h1>🚜 出差紀錄系統 V3</h1>

<div class="card">
<div class="grid">
<div><label>案件名稱</label><input id="caseName"></div>
<div><label>日期</label><input type="date" id="date"></div>
<div><label>交通工具</label>
<select id="vehicle">
<option value="2">機車(2元)</option>
<option value="3">汽車(3元)</option>
</select></div>
<div><label>公里數</label><input type="number" step="0.1" id="km"></div>
<div><label>雜費</label>
<select id="misc">
<option>50</option><option>80</option><option>100</option><option>180</option>
</select></div>
<div><label>地圖圖片</label><input type="file" id="photo"></div>
</div>
<button class="primary" onclick="addRec()">新增</button>
<button class="success" onclick="downloadBackup()">備份JSON</button>
<input type="file" id="restore" onchange="restoreBackup()">
</div>

<div class="card">
<table>
<thead><tr><th>編號</th><th>案件</th><th>日期</th><th>合計</th><th>地圖</th><th>刪除</th></tr></thead>
<tbody id="tb"></tbody>
</table>
</div>

<script>
let data=JSON.parse(localStorage.getItem('tripV3')||'[]');

function roc(d){
 let x=new Date(d);
 return (x.getFullYear()-1911)+'年'+(x.getMonth()+1)+'月'+x.getDate()+'日';
}

function save(){
 localStorage.setItem('tripV3',JSON.stringify(data));
 render();
}

function addRec(){
 let f=document.getElementById('photo').files[0];
 let r=new FileReader();
 r.onload=function(){
   let km=Math.round(parseFloat(document.getElementById('km').value||0));
   let rate=parseInt(document.getElementById('vehicle').value);
   let mileage=km<15?0:km*rate;
   let misc=parseInt(document.getElementById('misc').value);
   data.push({
      caseName:caseName.value,
      date:date.value,
      km,misc,rate,
      total:mileage+misc,
      image:r.result||''
   });
   save();
 };
 if(f){r.readAsDataURL(f)} else {r.onload()}
}

function del(i){data.splice(i,1);save();}

function render(){
 tb.innerHTML='';
 data.forEach((x,i)=>{
  tb.innerHTML+=`<tr>
  <td>${i+1}</td>
  <td>${x.caseName}</td>
  <td>${roc(x.date)}</td>
  <td>${x.total}元</td>
  <td>${x.image?'<img class="thumb" src="'+x.image+'">':''}</td>
  <td><button class="danger" onclick="del(${i})">刪除</button></td>
  </tr>`;
 });
}

function downloadBackup(){
 let blob=new Blob([JSON.stringify(data)],{type:'application/json'});
 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='backup.json';
 a.click();
}

function restoreBackup(){
 let f=document.getElementById('restore').files[0];
 let r=new FileReader();
 r.onload=function(){
  data=JSON.parse(r.result);
  save();
 };
 r.readAsText(f);
}

render();
</script>
</body>
</html>
