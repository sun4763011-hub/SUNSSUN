<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>出差紀錄系統</title>
<style>
body{font-family:"Microsoft JhengHei",sans-serif;background:#eef4fb;margin:0;padding:20px}
.header{background:#1e5fd8;color:#fff;padding:18px;border-radius:12px;font-size:28px;font-weight:bold}
.card{background:#fff;margin-top:15px;padding:20px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
label{font-weight:bold;display:block;margin-bottom:5px}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{background:#1e5fd8;color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;margin-right:8px}
button:hover{opacity:.9}
table{width:100%;border-collapse:collapse}
th{background:#1e5fd8;color:#fff}
th,td{padding:10px;border:1px solid #ddd;text-align:center}
tr:nth-child(even){background:#f8fbff}
tr:hover{background:#e8f1ff}
.thumb{max-width:80px;max-height:60px}
@media print{
 body *{visibility:hidden}
 #pdfArea,#pdfArea *{visibility:visible}
 #pdfArea{position:absolute;left:0;top:0;width:100%}
 .pdfItem:nth-child(2n){page-break-after:always}
}
.pdfItem{margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid #ccc}
.pdfItem img{width:100%;max-width:700px}
</style>
</head>
<body>

<div class="header">出差紀錄系統</div>

<div class="card">
<h3>新增出差紀錄</h3>
<div class="grid">
<div>
<label>日期</label>
<input type="date" id="tripDate">
</div>

<div>
<label>交通工具</label>
<select id="vehicle">
<option value="2">機車（2元/公里）</option>
<option value="3">汽車（3元/公里）</option>
</select>
</div>

<div>
<label>公里數</label>
<input type="number" step="0.1" id="km">
</div>

<div>
<label>雜費</label>
<select id="misc">
<option value="50">50元</option>
<option value="80">80元</option>
<option value="100">100元</option>
<option value="180">180元</option>
</select>
</div>
</div>

<br>

<label>地圖圖片</label>
<input type="file" id="photo" accept="image/*">

<br><br>

<button onclick="addRecord()">新增紀錄</button>
</div>

<div class="card">
<h3>月份查詢 / PDF匯出</h3>
<div class="grid">
<div>
<label>年份</label>
<select id="filterYear"></select>
</div>
<div>
<label>月份</label>
<select id="filterMonth"></select>
</div>
</div>
<br>
<button onclick="render()">查詢</button>
<button onclick="window.print()">匯出PDF</button>
<div id="resultCount" style="margin-top:10px;font-weight:bold"></div>
</div>

<div class="card">
<h3>出差紀錄</h3>
<table>
<thead>
<tr>
<th>編號</th>
<th>日期</th>
<th>交通工具</th>
<th>公里數</th>
<th>里程費</th>
<th>雜費</th>
<th>合計</th>
<th>地圖</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div id="pdfArea" class="card">
<div id="pdfContent"></div>
</div>

<script>
const today=new Date();
tripDate.value=today.toISOString().split('T')[0];

for(let y=110;y<=130;y++){
 filterYear.innerHTML+=`<option value="${y}">${y}年</option>`;
}
for(let m=1;m<=12;m++){
 filterMonth.innerHTML+=`<option value="${m}">${m}月</option>`;
}

let records=JSON.parse(localStorage.getItem('tripSystemData')||'[]');

function rocDate(dateStr){
 let d=new Date(dateStr);
 return (d.getFullYear()-1911)+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
}

function addRecord(){
 const file=photo.files[0];
 const reader=new FileReader();

 reader.onload=function(e){
   const kmValue=parseFloat(km.value||0);
   const rounded=Math.round(kmValue);
   const rate=parseInt(vehicle.value);
   const mileage=rounded<15?0:rounded*rate;

   records.push({
      date:tripDate.value,
      vehicle:rate==2?'機車':'汽車',
      rate:rate,
      km:rounded,
      mileage:mileage,
      misc:parseInt(misc.value),
      image:e.target ? e.target.result : ''
   });

   localStorage.setItem('tripSystemData',JSON.stringify(records));
   render();

   km.value='';
   photo.value='';
 };

 if(file){reader.readAsDataURL(file);}
 else{reader.onload({target:{result:''}});}
}

function render(){
 const fy=filterYear.value;
 const fm=filterMonth.value;

 const list=records.filter(r=>{
      const d=new Date(r.date);
      const y=d.getFullYear()-1911;
      const m=d.getMonth()+1;
      return y==fy && m==fm;
 });

 tbody.innerHTML='';
 pdfContent.innerHTML='';

 resultCount.innerHTML='共 '+list.length+' 筆資料';

 list.forEach((r,i)=>{
    const total=r.mileage+r.misc;

    tbody.innerHTML+=`
    <tr>
      <td>${i+1}</td>
      <td>${rocDate(r.date)}</td>
      <td>${r.vehicle}</td>
      <td>${r.km}</td>
      <td>${r.km<15?'未達15公里=0元':r.km+'×'+r.rate+'='+r.mileage+'元'}</td>
      <td>${r.misc}元</td>
      <td>${total}元</td>
      <td>${r.image?'<img class="thumb" src="'+r.image+'">':''}</td>
    </tr>`;

    pdfContent.innerHTML+=`
    <div class="pdfItem">
      <h2>${i+1}. ${rocDate(r.date)}</h2>
      <p>${r.km<15?'未達15公里，里程費0元':r.km+'公里 × '+r.rate+'元 = '+r.mileage+'元'}</p>
      <p>雜費：${r.misc}元</p>
      <p>合計：${total}元</p>
      ${r.image?'<img src="'+r.image+'">':''}
    </div>`;
 });
}

filterYear.value=today.getFullYear()-1911;
filterMonth.value=today.getMonth()+1;
render();
</script>
</body>
</html>
