<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出差訪視紀錄系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:20px}
.container{background:#fff;padding:20px;border-radius:10px}
input,textarea{width:100%;padding:8px;margin:4px 0}
button{padding:8px 12px;margin:4px}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
img{max-width:80px}
</style>
</head>
<body>
<div class="container">
<h2>出差訪視紀錄系統</h2>

<input type="date" id="date">
<input type="text" id="caseNo" placeholder="案件編號">
<input type="text" id="location" placeholder="訪視地點">
<input type="number" id="km" placeholder="公里數" oninput="calc()">
<input type="number" id="other" placeholder="雜費" value="0" oninput="calc()">
<input type="number" id="mileage" placeholder="里程費" readonly>
<input type="number" id="total" placeholder="總金額" readonly>
<textarea id="remark" placeholder="備註"></textarea>
<input type="file" id="photo" accept="image/*">

<button onclick="addRecord()">新增紀錄</button>
<button onclick="exportPDF()">匯出PDF</button>

<table id="tbl">
<thead>
<tr>
<th>日期</th><th>案號</th><th>地點</th><th>公里</th>
<th>里程費</th><th>雜費</th><th>總額</th><th>照片</th><th>刪除</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script>
let records = JSON.parse(localStorage.getItem("tripRecords")||"[]");

function calc(){
 let km=Number(document.getElementById("km").value||0);
 let mileage=km*2;
 document.getElementById("mileage").value=mileage;
 let other=Number(document.getElementById("other").value||0);
 document.getElementById("total").value=mileage+other;
}

function save(){
 localStorage.setItem("tripRecords",JSON.stringify(records));
}

function render(){
 let tb=document.querySelector("#tbl tbody");
 tb.innerHTML="";
 records.forEach((r,i)=>{
   let tr=document.createElement("tr");
   tr.innerHTML=`
   <td>${r.date}</td>
   <td>${r.caseNo}</td>
   <td>${r.location}</td>
   <td>${r.km}</td>
   <td>${r.mileage}</td>
   <td>${r.other}</td>
   <td>${r.total}</td>
   <td>${r.photo?'<img src="'+r.photo+'">':''}</td>
   <td><button onclick="delRec(${i})">刪除</button></td>`;
   tb.appendChild(tr);
 });
}

function delRec(i){
 records.splice(i,1);
 save();
 render();
}

function addRecord(){
 const file=document.getElementById("photo").files[0];
 const reader=new FileReader();
 reader.onload=function(){
   records.push({
     date:date.value,
     caseNo:caseNo.value,
     location:location.value,
     km:km.value,
     mileage:mileage.value,
     other:other.value,
     total:total.value,
     remark:remark.value,
     photo:reader.result||""
   });
   save();
   render();
 };
 if(file){ reader.readAsDataURL(file); }
 else{
   reader.onload();
 }
}

async function exportPDF(){
 const { jsPDF } = window.jspdf;
 const doc = new jsPDF();
 let y=15;
 doc.setFontSize(14);
 doc.text("出差訪視紀錄報表",10,y);
 y+=10;

 records.forEach((r,idx)=>{
   doc.setFontSize(10);
   doc.text(
    `${idx+1}. ${r.date} | ${r.caseNo} | ${r.location} | 總額:${r.total}`,
    10,y
   );
   y+=8;
   if(y>270){
      doc.addPage();
      y=15;
   }
 });

 doc.save("出差訪視紀錄.pdf");
}

render();
</script>
</body>
</html>
